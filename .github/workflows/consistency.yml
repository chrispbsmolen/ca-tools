# On every pull request and on pushes to branches other than main: check
# that the table, the MANIFEST, the array files and the documents agree,
# and that every array file re-hashes to its MANIFEST entry. The generated
# counts in table/README.md are refreshed after merge, so they are not
# compared here (--pr). On main the same checks run inside table-page.yml.

name: Consistency

on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Consistency (and append-only against the target branch)
        # compare with the commit the pull request branched from (the merge base of
        # the checked-out commit and the base branch), never with a newer main: rows
        # that main gained after the branch was cut are not rows the PR removed
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$PR_BASE" ]; then
            base=$(git merge-base HEAD "$PR_BASE" 2>/dev/null || echo "$PR_BASE")
          else
            base=$(git merge-base HEAD origin/main)
          fi
          echo "comparing with $base"
          python3 tools/consistency.py --check --pr --base "$base"
      - name: Self-test
        run: python3 tools/check_submission.py --selftest --table-dir table > /dev/null
