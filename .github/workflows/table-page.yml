# After every push to main (and on a manual run): add the table rows of
# every merged submission that is not in the table yet, i.e. every
# submissions/<slug>/claims.csv whose slug no table row names ("submission
# <slug>" in the notes) and that has no NOT_APPLIED.md. Each is checked
# again against the table at that moment. This does not depend on which
# push started the run, so a run that GitHub cancels while it waits (the
# concurrency group keeps one pending run) loses nothing: the next run
# picks the submission up. Then regenerate table/derived.csv (tools/derive_table.py), the R data file and the
# generated counts in table/README.md from table/ca_table.csv, rebuild the
# page docs/index.html (served by GitHub Pages from docs/ on main), run the
# consistency checks and the self-test, and commit what changed. Runs never
# overlap, and each starts from the newest main, so submissions are added
# one at a time and their rows never collide. A submission that does not
# pass on main is not added: its report is committed as
# submissions/<slug>/NOT_APPLIED.md (delete that file to try again) and its
# pull request gets the report as a comment. If a check fails the run turns
# red, GitHub emails the person who pushed, and nothing is committed.
#
# Certificate submissions (submissions/<slug>/certificates.csv, since 2026-11-02) are checked
# by certificate-check.yml, in shards, after the merge; that workflow writes nothing and starts
# this one when its results are saved. Here every certificate submission whose rows are not in
# the table yet ("submissions/<slug>/certificates.csv" in no row's notes) and that has no
# NOT_APPLIED.md gets its result from the newest completed run of certificate-check.yml on main
# (push or manual run of this repository, never a pull request run) that holds one. The result
# is checked again against the table at this moment (identity, duplicates, the shard counts,
# the comparison; tools/check_certificates.py --apply-result) and its rows are entered, VERIFIED
# or SCREENED, or its report is committed as NOT_APPLIED.md. A submission without a result yet
# is listed in the run summary as waiting and picked up by a later run.
#
# Upgrade requests (submissions/<slug>/upgrade.csv, since 2026-11-02) ask for the exact check of
# SCREENED entries. certificate-check.yml runs the check in shards and saves the result in the
# same artifact; here every request not in the table yet ("requested in submissions/<slug> by" in
# no row's notes) and without NOT_APPLIED.md gets that result checked again against the table at
# this moment (tools/check_upgrades.py --apply-result: the entries are still SCREENED with no
# VERIFIED row, the shard outputs are merged again with the tools of this commit) and a VERIFIED
# row is entered beside each SCREENED row that passed. A request that fails, or of which no entry
# passed (over the budget, or shards that did not finish), gets NOT_APPLIED.md with the report.
#
# Construction certificates (submissions/<slug>/constructions.csv, since 2026-11-02) are checked
# here, with the tools of this commit, like claims.csv: tools/check_constructions.py re-runs
# tools/construction_cert.py on every certificate (a fraction of a second each), and enters the
# rows, the certificates (table/constructions/<slug>/) and the rebuilt arrays that fit the
# storage rules (table/arrays/), or writes NOT_APPLIED.md.

name: Table page

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: read           # the results of certificate-check.yml (artifacts)

concurrency:
  group: table-page
  cancel-in-progress: false

env:
  # GitHub-hosted runner for a public repository: 4 cores, 6 hour job limit. The check uses
  # 2 threads (the budgets and the cost model of ca_verify were measured with 2).
  THREADS: "2"
  BUDGET_MINUTES: "15"          # per array
  TOTAL_BUDGET_MINUTES: "300"   # all submissions in this run
  SCREEN_THRESHOLD: "0"         # 0 is off. An array is screened when its predicted full check takes more than 40 percent of the budget (FULL_FRACTION in tools/check_submission.py). Until 2026-11-02 this was 5e10, a limit on C(k,t) * v^t
  GH_TOKEN: ${{ github.token }}
  BEFORE: ${{ github.event.before }}

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Add the rows of merged submissions not yet in the table
        run: |
          : > applied.txt
          slugs=""
          for f in submissions/*/claims.csv; do
            [ -f "$f" ] || continue
            slug=$(basename "$(dirname "$f")")
            case "$slug" in example|*[!A-Za-z0-9._-]*) continue ;; esac
            [ -f "submissions/$slug/NOT_APPLIED.md" ] && continue
            if grep -qE "submission ${slug//./\\.}([;,\"])" table/ca_table.csv; then continue; fi
            slugs="$slugs $slug"
          done
          [ -n "$slugs" ] || { echo "Every merged submission is in the table."; exit 0; }
          echo "Not yet in the table:$slugs"
          cc -O3 -pthread -o ca_verify ca_verify.c
          cc -O2 -o tools/constant_rows tools/constant_rows.c
          stamp=$(git rev-parse --short HEAD)
          start=$(date +%s)
          for slug in $slugs; do
            # the pull request that added this submission (not the one that started the run)
            added=$(git log --diff-filter=A --format=%H -n 1 -- "submissions/$slug/claims.csv")
            pr=""
            [ -n "$added" ] && pr=$(gh api "repos/$GITHUB_REPOSITORY/commits/$added/pulls" --jq '.[0].number' 2>/dev/null || true)
            case "$pr" in ''|*[!0-9]*) pr="" ;; esac
            left=$(( TOTAL_BUDGET_MINUTES - ($(date +%s) - start) / 60 ))
            if python3 tools/check_submission.py "submissions/$slug" \
                 --table-dir table --ca-verify ./ca_verify --threads "$THREADS" \
                 --budget-minutes "$BUDGET_MINUTES" --total-budget-minutes "$left" \
                 --screen-threshold "$SCREEN_THRESHOLD" --pr "${pr:-main}" --stamp-version "$stamp" \
                 --out "out/$slug" --apply > /dev/null; then
              echo "$slug" >> applied.txt
              msg="Merged and added to the table: \`$slug\` (checked again on main at $stamp)."
            else
              echo "::warning::submission $slug did not pass on main and was not added; see the run summary"
              msg="Merged, but \`$slug\` did not pass when checked again on main at $stamp, so nothing was added to the table. Report below."
              { echo "# Not added to the table"; echo; echo "Checked again on main at $stamp; it did not pass. Delete this file to try again."; echo; cat "out/$slug/report.md"; } > "submissions/$slug/NOT_APPLIED.md"
            fi
            cat "out/$slug/report.md" >> "$GITHUB_STEP_SUMMARY"
            if [ -n "$pr" ]; then
              { echo "$msg"; echo; head -c 55000 "out/$slug/report.md"; } > c.md
              gh pr comment "$pr" --repo "$GITHUB_REPOSITORY" --body-file c.md || true
            fi
          done
          rm -f ca_verify tools/constant_rows c.md
      - name: Add the rows of checked certificate submissions not yet in the table
        run: |
          : > applied_cert.txt
          pending=""
          for f in submissions/*/certificates.csv; do
            [ -f "$f" ] || continue
            slug=$(basename "$(dirname "$f")")
            case "$slug" in example|*[!A-Za-z0-9._-]*) continue ;; esac
            [ -f "submissions/$slug/NOT_APPLIED.md" ] && continue
            grep -qF "submissions/$slug/certificates.csv" table/ca_table.csv && continue
            pending="$pending $slug"
          done
          [ -n "$pending" ] || { echo "Every merged certificate submission is in the table."; exit 0; }
          echo "Certificate submissions not yet in the table:$pending"
          # completed runs of certificate-check.yml on main of this repository, started by a push or
          # by the maintainer, newest first (a pull request run never counts)
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/certificate-check.yml/runs?branch=main&status=completed&per_page=50" \
            --jq '.workflow_runs[] | select(.event == "push" or .event == "workflow_dispatch")
                  | select(.head_repository.full_name == "'"$GITHUB_REPOSITORY"'") | .id' > cert_runs.txt || : > cert_runs.txt
          stamp=$(git rev-parse --short HEAD)
          for slug in $pending; do
            found=""
            while read -r run; do
              case "$run" in ''|*[!0-9]*) continue ;; esac
              d="certres/$run"
              if [ ! -d "$d" ]; then
                mkdir -p "$d"
                gh run download "$run" --repo "$GITHUB_REPOSITORY" -n cert-results -D "$d" < /dev/null 2>/dev/null || true
              fi
              if [ -f "$d/$slug/result.json" ]; then found="$d/$slug"; break; fi
            done < cert_runs.txt
            if [ -z "$found" ]; then
              echo "Certificate submission \`$slug\`: waiting for certificate-check.yml (still running, or start it again for this slug)." >> "$GITHUB_STEP_SUMMARY"
              continue
            fi
            added=$(git log --diff-filter=A --format=%H -n 1 -- "submissions/$slug/certificates.csv")
            pr=""
            [ -n "$added" ] && pr=$(gh api "repos/$GITHUB_REPOSITORY/commits/$added/pulls" --jq '.[0].number' 2>/dev/null || true)
            case "$pr" in ''|*[!0-9]*) pr="" ;; esac
            if python3 tools/check_certificates.py "submissions/$slug" --table-dir table \
                 --apply-result "$found" --apply --out "out/cert-$slug" > /dev/null; then
              echo "$slug" >> applied_cert.txt
              msg="Merged and added to the table: \`$slug\` (certificates checked on main by certificate-check.yml, entered at $stamp)."
            else
              echo "::warning::certificate submission $slug did not pass on main and was not added"
              msg="Merged, but the certificates of \`$slug\` did not pass on main, so nothing was added to the table. Report below."
              { echo "# Not added to the table"; echo; echo "Checked on main at $stamp; it did not pass. Delete this file and start certificate-check.yml for this slug to try again."; echo
                cat "$found/report.md" 2>/dev/null; echo; cat "out/cert-$slug/report.md" 2>/dev/null; } > "submissions/$slug/NOT_APPLIED.md"
            fi
            { cat "$found/report.md" 2>/dev/null; cat "out/cert-$slug/report.md" 2>/dev/null; } >> "$GITHUB_STEP_SUMMARY"
            if [ -n "$pr" ]; then
              { echo "$msg"; echo; cat "$found/report.md" "out/cert-$slug/report.md" 2>/dev/null | head -c 55000; } > c.md
              gh pr comment "$pr" --repo "$GITHUB_REPOSITORY" --body-file c.md || true
            fi
          done
          rm -rf certres cert_runs.txt c.md
      - name: Add the rows of checked upgrade requests not yet in the table
        run: |
          : > applied_up.txt
          pending=""
          for f in submissions/*/upgrade.csv; do
            [ -f "$f" ] || continue
            slug=$(basename "$(dirname "$f")")
            case "$slug" in example|*[!A-Za-z0-9._-]*) continue ;; esac
            [ -f "submissions/$slug/NOT_APPLIED.md" ] && continue
            grep -qF "requested in submissions/$slug by" table/ca_table.csv && continue
            pending="$pending $slug"
          done
          [ -n "$pending" ] || { echo "Every merged upgrade request is in the table."; exit 0; }
          echo "Upgrade requests not yet in the table:$pending"
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/certificate-check.yml/runs?branch=main&status=completed&per_page=50" \
            --jq '.workflow_runs[] | select(.event == "push" or .event == "workflow_dispatch")
                  | select(.head_repository.full_name == "'"$GITHUB_REPOSITORY"'") | .id' > up_runs.txt || : > up_runs.txt
          stamp=$(git rev-parse --short HEAD)
          for slug in $pending; do
            found=""
            while read -r run; do
              case "$run" in ''|*[!0-9]*) continue ;; esac
              d="upres/$run"
              if [ ! -d "$d" ]; then
                mkdir -p "$d"
                gh run download "$run" --repo "$GITHUB_REPOSITORY" -n cert-results -D "$d" < /dev/null 2>/dev/null || true
              fi
              if [ -f "$d/$slug/result.json" ]; then found="$d/$slug"; break; fi
            done < up_runs.txt
            if [ -z "$found" ]; then
              echo "Upgrade request \`$slug\`: waiting for certificate-check.yml (still running, or start it again for this slug)." >> "$GITHUB_STEP_SUMMARY"
              continue
            fi
            added=$(git log --diff-filter=A --format=%H -n 1 -- "submissions/$slug/upgrade.csv")
            pr=""
            [ -n "$added" ] && pr=$(gh api "repos/$GITHUB_REPOSITORY/commits/$added/pulls" --jq '.[0].number' 2>/dev/null || true)
            case "$pr" in ''|*[!0-9]*) pr="" ;; esac
            rc=0
            python3 tools/check_upgrades.py "submissions/$slug" --table-dir table \
              --apply-result "$found" --apply --out "out/up-$slug" > /dev/null || rc=$?
            if [ "$rc" = 0 ]; then
              echo "$slug" >> applied_up.txt
              msg="Merged: the exact check of \`$slug\` ran on main (certificate-check.yml) and its VERIFIED rows were entered at $stamp. Entries that stayed SCREENED, if any, are listed below."
            else
              if [ "$rc" = 3 ]; then
                why="No entry passed the exact check in time (over the budget, or shards that did not finish), so every entry stays SCREENED."
              else
                echo "::warning::upgrade request $slug did not pass on main and was not added"
                why="The request did not pass on main, so nothing was added to the table."
              fi
              msg="Merged. $why Report below."
              { echo "# Not added to the table"; echo; echo "Checked on main at $stamp. $why Delete this file and start certificate-check.yml for this slug to try again."; echo
                cat "$found/report.md" 2>/dev/null; echo; cat "out/up-$slug/report.md" 2>/dev/null; } > "submissions/$slug/NOT_APPLIED.md"
            fi
            { cat "$found/report.md" 2>/dev/null; cat "out/up-$slug/report.md" 2>/dev/null; } >> "$GITHUB_STEP_SUMMARY"
            if [ -n "$pr" ]; then
              { echo "$msg"; echo; cat "$found/report.md" "out/up-$slug/report.md" 2>/dev/null | head -c 55000; } > c.md
              gh pr comment "$pr" --repo "$GITHUB_REPOSITORY" --body-file c.md || true
            fi
          done
          rm -rf upres up_runs.txt c.md
      - name: Add the rows of merged construction certificates not yet in the table
        run: |
          : > applied_con.txt
          slugs=""
          for f in submissions/*/constructions.csv; do
            [ -f "$f" ] || continue
            slug=$(basename "$(dirname "$f")")
            case "$slug" in example|*[!A-Za-z0-9._-]*) continue ;; esac
            [ -f "submissions/$slug/NOT_APPLIED.md" ] && continue
            grep -qF "submissions/$slug/constructions.csv" table/ca_table.csv && continue
            slugs="$slugs $slug"
          done
          [ -n "$slugs" ] || { echo "Every merged construction submission is in the table."; exit 0; }
          echo "Construction submissions not yet in the table:$slugs"
          cc -O3 -pthread -o ca_verify ca_verify.c
          cc -O2 -o tools/constant_rows tools/constant_rows.c
          stamp=$(git rev-parse --short HEAD)
          for slug in $slugs; do
            added=$(git log --diff-filter=A --format=%H -n 1 -- "submissions/$slug/constructions.csv")
            pr=""
            [ -n "$added" ] && pr=$(gh api "repos/$GITHUB_REPOSITORY/commits/$added/pulls" --jq '.[0].number' 2>/dev/null || true)
            case "$pr" in ''|*[!0-9]*) pr="" ;; esac
            if python3 tools/check_constructions.py "submissions/$slug" --table-dir table --ca-verify ./ca_verify \
                 --threads "$THREADS" --pr "${pr:-main}" --out "out/con-$slug" --apply > /dev/null; then
              echo "$slug" >> applied_con.txt
              msg="Merged and added to the table: \`$slug\` (construction certificates checked again on main at $stamp)."
            else
              echo "::warning::construction submission $slug did not pass on main and was not added"
              msg="Merged, but \`$slug\` did not pass when checked again on main at $stamp, so nothing was added to the table. Report below."
              { echo "# Not added to the table"; echo; echo "Checked again on main at $stamp; it did not pass. Delete this file to try again."; echo; cat "out/con-$slug/report.md"; } > "submissions/$slug/NOT_APPLIED.md"
            fi
            cat "out/con-$slug/report.md" >> "$GITHUB_STEP_SUMMARY"
            if [ -n "$pr" ]; then
              { echo "$msg"; echo; head -c 55000 "out/con-$slug/report.md"; } > c.md
              gh pr comment "$pr" --repo "$GITHUB_REPOSITORY" --body-file c.md || true
            fi
          done
          rm -f ca_verify tools/constant_rows c.md
      - name: Regenerate table/derived.csv (sizes that follow by published constructions)
        run: python3 tools/derive_table.py
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
      - name: Regenerate table/ca_table.rda if its content differs from the CSV
        run: |
          Rscript -e 'source("table/ca_table.R"); x <- load_ca_table("table/ca_table.csv"); e <- new.env(); same <- file.exists("table/ca_table.rda") && { load("table/ca_table.rda", envir = e); identical(x, e$ca_table) }; if (same) cat("rda current\n") else { make_rda("table/ca_table.csv", "table/ca_table.rda"); cat("rda regenerated\n") }'
      - name: Regenerate the counts in table/README.md
        run: python3 tools/consistency.py --write
      - name: Render docs/index.html
        run: |
          python3 tools/render_table.py --table-dir table --out docs/index.html --date "$(date -u +%F)"
          python3 tools/render_derived.py --table-dir table --out docs/derived.html --date "$(date -u +%F)"
      - name: Check (consistency and self-test)
        run: |
          if [ -n "$BEFORE" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            python3 tools/consistency.py --check --base "$BEFORE"
          else
            python3 tools/consistency.py --check
          fi
          python3 tools/check_submission.py --selftest --table-dir table > /dev/null
      - name: Commit what changed
        run: |
          git add docs/index.html docs/derived.html table/README.md table/ca_table.rda table/ca_table.csv table/MANIFEST.csv table/arrays table/derived.csv table/certificates table/EXTERNAL.csv table/constructions
          git add submissions/*/NOT_APPLIED.md 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git config user.name "ca-table-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cat applied_cert.txt applied_up.txt applied_con.txt >> applied.txt 2>/dev/null || true
          if [ -s applied.txt ]; then
            git commit -q -m "Add submissions $(tr '\n' ' ' < applied.txt)to the table (checked again on main); regenerate table page, counts and R data file"
          else
            git commit -q -m "Regenerate table page, counts and R data file"
          fi
          for i in 1 2 3; do
            git pull --rebase -q && git push && exit 0
            sleep 10
          done
          exit 1
